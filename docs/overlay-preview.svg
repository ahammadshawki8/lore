<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">LORE overlay screenshot placeholder</title>
  <desc id="desc">A dark star field with a gold frame marking the future overlay screenshot.</desc>
  <defs>
    <radialGradient id="space"><stop stop-color="#342044"/><stop offset="1" stop-color="#090712"/></radialGradient>
    <linearGradient id="gold"><stop stop-color="#fff1b8"/><stop offset=".5" stop-color="#f5c451"/><stop offset="1" stop-color="#8f6422"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#space)"/>
  <g fill="#eadbc0" opacity=".65"><circle cx="60" cy="48" r="2"/><circle cx="135" cy="113" r="1.5"/><circle cx="540" cy="78" r="2"/><circle cx="470" cy="282" r="1.5"/><circle cx="214" cy="300" r="2"/><circle cx="584" cy="194" r="1"/></g>
  <rect x="22" y="22" width="596" height="316" rx="18" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".7"/>
  <text x="320" y="166" fill="#f5c451" font-family="Georgia,serif" font-size="31" font-weight="700" text-anchor="middle" letter-spacing="5">LORE OVERLAY</text>
  <text x="320" y="198" fill="#d3c4e4" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">SCREENSHOT PLACEHOLDER</text>
</svg>
