<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0714">
    <title>LORE Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/overlay.css">
  </head>
  <body>
    <main id="overlay" aria-live="polite">
      <canvas id="particle-canvas" aria-hidden="true"></canvas>
      <div id="ray-field" aria-hidden="true"></div>
      <div id="vignette" aria-hidden="true"></div>
      <div id="flash" aria-hidden="true"></div>
      <section id="pressure" aria-label="Chat lore pressure">
        <svg id="pressure-svg" viewBox="0 0 200 200" aria-hidden="true"></svg>
        <div class="pressure-copy">
          <span id="pressure-phrase">lore stirs</span>
          <small>chat senses lore...</small>
        </div>
      </section>
      <section id="scene-layer" aria-label="LORE live scene"></section>
      <aside id="corner-chip" aria-live="polite"></aside>
      <button id="sound-enable" type="button">CLICK TO ENABLE SOUND</button>
      <div id="grain" aria-hidden="true"></div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="/overlay.js"></script>
  </body>
</html>
